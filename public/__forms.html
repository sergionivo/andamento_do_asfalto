<!doctype html>
<html lang="pt-BR">
  <head><meta charset="utf-8"><title>Definições de formulários</title></head>
  <body>
    <!-- Detectado pelo Netlify no build. A interface visível é renderizada pelo React. -->
    <form name="community-update" method="POST" enctype="multipart/form-data" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="community-update">
      <input name="bot-field">
      <input name="segmentId">
      <input name="streetLabel">
      <input name="observedAt">
      <input name="observationType">
      <textarea name="details"></textarea>
      <input name="contributorName">
      <input name="contact">
      <input name="consent">
      <input type="file" name="photo_1">
      <input type="file" name="photo_2">
      <input type="file" name="photo_3">
      <input type="file" name="photo_4">
    </form>
  </body>
</html>
